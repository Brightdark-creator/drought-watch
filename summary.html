<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results for all fields</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/summary.js"></script>
</head>
<body class="summary-page">
  <header class="topbar">
    <div class="topbar-inner">
    <div class="brand">
      <img class="logo" src="icons/icon.svg" alt="" width="36" height="36">
      <div>
        <h1 data-i18n="summaryTitle">Results for all fields</h1>
        <p class="tagline" data-i18n="appTitle"></p>
      </div>
    </div>
    <div class="settings">
      <a class="button-link" href="./" data-i18n="navHome"></a>
      <a class="button-link" href="check.html" data-i18n="backToApp"></a>
      <button id="print" type="button" class="toggle" data-i18n="print"></button>
    </div>
    </div>
  </header>

  <main>
    <p id="headline" class="headline"></p>
    <p class="intro" data-i18n="summaryIntro"></p>

    <section class="panel">
      <h2 data-i18n="summaryOverview"></h2>
      <div id="overview" class="table-wrap" tabindex="0" role="region" data-i18n-aria-label="summaryOverview"></div>
      <p class="hint" data-i18n="summaryColumns"></p>
    </section>

    <!-- Do other, independent sources show the same drought? -->
    <section class="panel">
      <h2 data-i18n="agreeTitle"></h2>
      <div id="agreement"></div>
    </section>
    <section>
      <h2 data-i18n="summaryFields"></h2>
      <div id="fields" class="field-cards"></div>
    </section>

    <section class="panel">
      <h2 data-i18n="howTitle"></h2>
      <p data-i18n="how1"></p>
      <p data-i18n="how2"></p>
      <p data-i18n="how3"></p>
      <p data-i18n="how4"></p>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footerSample"></p>
  </footer>
</body>
</html>
