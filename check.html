<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drought Watch</title>
  <meta name="description" content="Drought status for any place on Earth from daily soil-water data, plus Sentinel-2 satellite case studies.">
  <meta name="theme-color" content="#0f1613">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Drought Watch">
  <!-- The theme (dark / earth / light) is set before the page draws, so it never flashes -->
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('dw.theme') || 'dark'; } catch {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/style.css">
  <!-- Libraries are downloaded only when needed: Leaflet (map) by js/map.js and Chart.js by js/charts.js.
       Light mode needs neither, so it loads fast on slow internet. -->
  <script type="module" src="js/app.js"></script>
</head>
<body class="app" data-state="empty">
  <a class="skip-link" href="#panel" data-i18n="skipToResult">Skip to the result</a>

  <!-- Top bar, floating over the map: name, search, settings -->
  <header class="appbar">
    <a class="brand" href="./" data-i18n-title="navHome">
      <img class="logo" src="icons/icon.svg" alt="" width="32" height="32">
      <span class="brand-name" data-i18n="appTitle">Drought Watch</span>
    </a>

    <form id="search" class="search" role="search">
      <label class="visually-hidden" for="search-input" data-i18n="searchLabel"></label>
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search-input" type="search" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="searchPlaceholder">
      <button type="button" id="locate" class="icon-button" data-i18n-aria-label="locate" data-i18n-title="locate">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="submit" class="search-go" data-i18n="searchButton">Search</button>
    </form>

    <!-- Settings in one menu: colours, language, data saver, your own file -->
    <details class="menu" id="settings-menu">
      <summary data-i18n-aria-label="settingsLabel" data-i18n-title="settingsLabel">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </summary>
      <div class="menu-panel">
        <div class="menu-row">
          <span id="theme-label" data-i18n="themeLabel">Colours</span>
          <div class="theme-swatches" role="group" aria-labelledby="theme-label">
            <button type="button" data-theme-pick="dark" aria-pressed="false"><i class="sw-dark"></i><span data-i18n="theme_dark">Dark</span></button>
            <button type="button" data-theme-pick="earth" aria-pressed="false"><i class="sw-earth"></i><span data-i18n="theme_earth">Earth</span></button>
            <button type="button" data-theme-pick="light" aria-pressed="false"><i class="sw-light"></i><span data-i18n="theme_light">Light</span></button>
          </div>
          <select id="theme" hidden aria-hidden="true" tabindex="-1"></select>
        </div>
        <label class="menu-row"><span data-i18n="language">Language</span><select id="lang"></select></label>
        <button id="light-toggle" type="button" class="toggle" aria-pressed="false" data-i18n-title="lightModeHint">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 18 18 4M9 5h10v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="lightMode">Data saver</span>
        </button>
        <!-- Your own Earth Engine file: picked here or dropped anywhere on the page -->
        <label class="upload-button pill" data-i18n-title="uploadHint">
          <input id="upload-input" type="file" accept=".csv,.json,text/csv,application/json" class="visually-hidden">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16V4M7 9l5-5 5 5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="uploadButton">Analyse your own file</span>
        </label>
      </div>
    </details>
  </header>

  <!-- The map fills the window -->
  <div id="map" class="map" role="region" data-i18n-aria-label="mapLabel"></div>

  <!-- Places opened in this visit -->
  <nav class="chips-row" data-i18n-aria-label="testFields">
    <div id="chips" class="chips"></div>
  </nav>

  <p id="message" class="message" role="status" hidden></p>

  <!-- Side panel (bottom sheet on phones): the result, in four tabs -->
  <aside id="panel" class="side" tabindex="-1" data-i18n-aria-label="panelLabel">
    <button type="button" id="panel-toggle" class="panel-toggle" aria-expanded="true" data-i18n-aria-label="panelToggle">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="side-scroll">
      <!-- Status: place, gauge, verdict, key numbers -->
      <section id="card" class="card" aria-live="polite"></section>

      <div class="tabs" role="tablist" data-i18n-aria-label="tabsLabel">
        <button type="button" role="tab" id="tab-overview" aria-controls="pane-overview" aria-selected="true" data-tab="overview" data-i18n="tabOverview">Overview</button>
        <button type="button" role="tab" id="tab-sources" aria-controls="pane-sources" aria-selected="false" tabindex="-1" data-tab="sources" data-i18n="tabSources">Sources</button>
        <button type="button" role="tab" id="tab-charts" aria-controls="pane-charts" aria-selected="false" tabindex="-1" data-tab="charts" data-i18n="tabCharts">Charts</button>
        <button type="button" role="tab" id="tab-how" aria-controls="pane-how" aria-selected="false" tabindex="-1" data-tab="how" data-i18n="tabHow">How</button>
      </div>

      <!-- 1. Overview: what to expect, the official check, pictures from space, the season -->
      <section id="pane-overview" class="pane" role="tabpanel" aria-labelledby="tab-overview">
        <div id="overview-extra"></div>

        <section id="space" class="space" hidden>
          <h3 class="section-title" data-i18n="spaceTitle"></h3>
          <p class="hint" data-i18n="spaceIntro"></p>
          <div class="space-tabs segmented" role="group" data-i18n-aria-label="spaceTitle">
            <button type="button" data-kind="rgb" aria-pressed="true" data-i18n="spaceTrue"></button>
            <button type="button" data-kind="ndvi" aria-pressed="false" data-i18n="spaceNdvi"></button>
          </div>
          <div id="space-grid" class="space-grid"></div>
          <div id="ndvi-scale" class="ndvi-scale" hidden aria-hidden="true">
            <span data-i18n="spaceLow"></span><span class="bar-scale"></span><span data-i18n="spaceHigh"></span>
          </div>
        </section>

        <section class="timeline-box">
          <h3 class="section-title" data-i18n="timelineTitle"></h3>
          <div id="timeline" class="timeline" tabindex="0" role="region" data-i18n-aria-label="timelineTitle"></div>
          <p class="hint" data-i18n="timelineHint"></p>
        </section>
      </section>

      <!-- 2. Sources: every source with its anomaly -->
      <section id="pane-sources" class="pane" role="tabpanel" aria-labelledby="tab-sources" hidden>
        <div id="sources-box"></div>
      </section>

      <!-- 3. Charts: replay the season, compare with a normal year, one chart per source -->
      <section id="pane-charts" class="pane" role="tabpanel" aria-labelledby="tab-charts" hidden>
        <section id="details" class="details" hidden>
          <div class="controls">
            <div class="replay">
              <label id="period-label" for="period-slider"></label>
              <input id="period-slider" type="range" step="1">
              <p class="hint" data-i18n="replayHint"></p>
            </div>
            <div class="compare">
              <label class="check">
                <input id="compare-toggle" type="checkbox">
                <span data-i18n="compareToggle"></span>
              </label>
              <label id="compare-year-label" class="visually-hidden" for="compare-year" data-i18n="compareYear" hidden></label>
              <select id="compare-year" hidden></select>
            </div>
          </div>

          <div class="charts-grid">
            <figure class="chart-box">
              <figcaption data-i18n="ndmiName"></figcaption>
              <div class="chart-wrap"><canvas id="chart-ndmi" role="img"></canvas><div id="lite-ndmi" class="lite-chart" role="img" hidden></div></div>
            </figure>
            <figure class="chart-box">
              <figcaption data-i18n="ndviName"></figcaption>
              <div class="chart-wrap"><canvas id="chart-ndvi" role="img"></canvas><div id="lite-ndvi" class="lite-chart" role="img" hidden></div></div>
            </figure>
          </div>
          <ul id="legend" class="legend"></ul>

          <section id="source-charts" class="source-charts" hidden>
            <h3 class="section-title" data-i18n="sourceChartsTitle">Every source through the season</h3>
            <p class="hint" data-i18n="sourceChartsHint"></p>
            <div id="source-charts-grid" class="source-charts-grid"></div>
          </section>

          <details class="table-box fold">
            <summary data-i18n="tableShow"></summary>
            <div id="table-wrap" class="table-wrap" tabindex="0" role="region" data-i18n-aria-label="tableShow"></div>
          </details>
        </section>
      </section>

      <!-- 4. How: the calculation with real numbers, settings, method, data export -->
      <section id="pane-how" class="pane" role="tabpanel" aria-labelledby="tab-how" hidden>
        <div id="calc-box"></div>

        <!-- Settings for an uploaded file or a live place (season, normal years) -->
        <section id="upload-settings" class="upload-panel" hidden>
          <h3 class="section-title" data-i18n="uploadSettings"></h3>
          <div class="upload-grid">
            <label><span data-i18n="seasonStart"></span><select id="up-start"></select></label>
            <label><span data-i18n="seasonYear"></span><select id="up-season"></select></label>
          </div>
          <fieldset>
            <legend data-i18n="normalYearsLabel"></legend>
            <div id="up-normals" class="year-boxes"></div>
          </fieldset>
          <label class="check keep-check">
            <input id="up-keep" type="checkbox">
            <span data-i18n="keepUpload"></span>
          </label>
          <div class="upload-actions">
            <span class="hint" data-i18n="uploadPrivacy"></span>
            <button id="up-remove" type="button" class="toggle pill" data-i18n="removeUpload"></button>
          </div>
        </section>

        <details class="explain fold">
          <summary data-i18n="howTitle"></summary>
          <p data-i18n="how1"></p>
          <p data-i18n="how2"></p>
          <p data-i18n="how3"></p>
          <p data-i18n="how4"></p>
        </details>

        <details class="explain fold">
          <summary data-i18n="exportTitle"></summary>
          <ol class="steps">
            <li data-i18n="export1"></li>
            <li data-i18n="export2"></li>
            <li data-i18n="export3"></li>
            <li data-i18n="export4"></li>
          </ol>
          <p><a href="tools/earth-engine-export.js" download data-i18n="exportScript"></a></p>
        </details>

        <footer class="side-footer">
          <p><a href="./" data-i18n="navHome">Home</a> · <a href="summary.html" data-i18n="summaryLink"></a> · <a href="tests.html">Tests</a></p>
          <p data-i18n="footerCredits"></p>
          <details class="phone-qr" id="phone-qr">
            <summary><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="2" width="12" height="20" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-i18n="qrOpen">Open on your phone</span></summary>
            <div class="qr-box"><div id="qr"></div><p data-i18n="qrHint"></p></div>
          </details>
        </footer>
      </section>
    </div>
  </aside>

  <div id="drop-overlay" class="drop-overlay" hidden aria-hidden="true"><p data-i18n="dropHere"></p></div>
</body>
</html>
