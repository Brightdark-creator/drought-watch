<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drought Watch</title>
  <meta name="description" content="Free drought early warning for crop fields from Sentinel-2 satellite data.">
  <meta name="theme-color" content="#1f6f50">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Drought Watch">
  <link rel="stylesheet" href="css/style.css">
  <!-- Libraries are downloaded only when needed: Leaflet (map) by js/map.js and Chart.js by js/charts.js.
       Light mode needs neither, so it loads fast on slow internet. -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="icons/icon.svg" alt="" width="36" height="36">
      <div>
        <h1 data-i18n="appTitle">Drought Watch</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="settings">
      <label class="visually-hidden" for="lang" data-i18n="language">Language</label>
      <select id="lang"></select>
      <button id="light-toggle" type="button" class="toggle" aria-pressed="false" data-i18n-title="lightModeHint">
        <span data-i18n="lightMode">Light mode</span>
      </button>
    </div>
  </header>

  <main>
    <form id="search" class="search" role="search">
      <label class="visually-hidden" for="search-input" data-i18n="searchLabel"></label>
      <input id="search-input" type="search" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="searchPlaceholder">
      <button type="button" id="locate" class="icon-button" data-i18n-aria-label="locate" data-i18n-title="locate">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </button>
      <button type="submit" data-i18n="searchButton">Search</button>
    </form>

    <!-- 1. Map -->
    <div id="map" class="map" role="region" data-i18n-aria-label="mapLabel"></div>

    <div class="chips-row">
      <span class="chips-label" data-i18n="testFields"></span>
      <div id="chips" class="chips"></div>
    </div>

    <!-- Your own Earth Engine file: picked with the button or dropped anywhere on the page -->
    <div class="upload-row">
      <label class="upload-button">
        <input id="upload-input" type="file" accept=".csv,.json,text/csv,application/json" class="visually-hidden">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 16V4M7 9l5-5 5 5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span data-i18n="uploadButton"></span>
      </label>
      <span class="hint" data-i18n="uploadHint"></span>
    </div>

    <p id="message" class="message" role="status" hidden></p>

    <!-- 2. Warning card -->
    <section id="card" class="card" aria-live="polite"></section>

    <!-- Settings for an uploaded file (season, normal years) -->
    <section id="upload-settings" class="panel upload-panel" hidden>
      <h3 data-i18n="uploadSettings"></h3>
      <div class="upload-grid">
        <label><span data-i18n="seasonStart"></span><select id="up-start"></select></label>
        <label><span data-i18n="seasonYear"></span><select id="up-season"></select></label>
      </div>
      <fieldset>
        <legend data-i18n="normalYearsLabel"></legend>
        <div id="up-normals" class="year-boxes"></div>
      </fieldset>
      <label class="check keep-check">
        <input id="up-keep" type="checkbox">
        <span data-i18n="keepUpload"></span>
      </label>
      <div class="upload-actions">
        <span class="hint" data-i18n="uploadPrivacy"></span>
        <button id="up-remove" type="button" class="toggle" data-i18n="removeUpload"></button>
      </div>
    </section>

    <!-- 3. Charts -->
    <section id="details" class="details" hidden>
      <div class="controls">
        <div class="timeline-box">
          <h3 data-i18n="timelineTitle"></h3>
          <div id="timeline" class="timeline"></div>
          <p class="hint" data-i18n="timelineHint"></p>
        </div>
        <div class="replay">
          <label id="period-label" for="period-slider"></label>
          <input id="period-slider" type="range" step="1">
          <p class="hint" data-i18n="replayHint"></p>
        </div>
        <div class="compare">
          <label class="check">
            <input id="compare-toggle" type="checkbox">
            <span data-i18n="compareToggle"></span>
          </label>
          <label id="compare-year-label" class="visually-hidden" for="compare-year" data-i18n="compareYear" hidden></label>
          <select id="compare-year" hidden></select>
        </div>
      </div>

      <figure class="chart-box">
        <figcaption data-i18n="ndmiName"></figcaption>
        <div class="chart-wrap"><canvas id="chart-ndmi" role="img"></canvas><div id="lite-ndmi" class="lite-chart" role="img" hidden></div></div>
      </figure>
      <figure class="chart-box">
        <figcaption data-i18n="ndviName"></figcaption>
        <div class="chart-wrap"><canvas id="chart-ndvi" role="img"></canvas><div id="lite-ndvi" class="lite-chart" role="img" hidden></div></div>
      </figure>
      <ul id="legend" class="legend"></ul>
      <details class="table-box">
        <summary data-i18n="tableShow"></summary>
        <div id="table-wrap" class="table-wrap" tabindex="0" role="region" data-i18n-aria-label="tableShow"></div>
      </details>
    </section>

    <details class="explain">
      <summary data-i18n="exportTitle"></summary>
      <ol class="steps">
        <li data-i18n="export1"></li>
        <li data-i18n="export2"></li>
        <li data-i18n="export3"></li>
        <li data-i18n="export4"></li>
      </ol>
      <p><a href="tools/earth-engine-export.js" download data-i18n="exportScript"></a></p>
    </details>

    <details class="explain">
      <summary data-i18n="howTitle"></summary>
      <p data-i18n="how1"></p>
      <p data-i18n="how2"></p>
      <p data-i18n="how3"></p>
      <p data-i18n="how4"></p>
    </details>
  </main>

  <div id="drop-overlay" class="drop-overlay" hidden aria-hidden="true"><p data-i18n="dropHere"></p></div>

  <footer class="footer">
    <p><a href="summary.html" data-i18n="summaryLink"></a> · <a href="tests.html">Tests</a></p>
    <p data-i18n="footerSample"></p>
    <p data-i18n="footerCredits"></p>
  </footer>
</body>
</html>
